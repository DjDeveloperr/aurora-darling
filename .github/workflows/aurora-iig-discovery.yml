name: Aurora IOSurface default context control

on:
  workflow_dispatch:

permissions: {}

jobs:
  reference:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Run one bounded IOSurface initializer boundary request
        shell: bash
        run: |
          python3 - <<'PYREF'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.request

          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'automatic/repeated execution is disabled'
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', revision)
          root = Path(os.environ['RUNNER_TEMP']) / 'aurora-iosurface-reference-default-context'
          root.mkdir(exist_ok=False)
          expected = {'iosurface-init.c': 'be86fe52c8df7089327ec2047b8b50de893135ee772271493b4ac7cd61d833cd', 'run-reference.py': '034ac08d7a730438440b5ae0c429599ec30ca49285358be4e7f513466c27f8e2'}
          for name, digest in expected.items():
              url = 'https://raw.githubusercontent.com/DjDeveloperr/aurora-darling/' + revision + '/tests/iosurface-reference/' + name
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = response.read(65537)
              assert len(data) <= 65536 and hashlib.sha256(data).hexdigest() == digest
              (root / name).write_bytes(data)
          subprocess.run(['python3', str(root / 'run-reference.py')], check=True, timeout=150)
          PYREF
