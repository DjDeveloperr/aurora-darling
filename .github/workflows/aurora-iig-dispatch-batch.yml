name: Aurora eight-class generated interface IIG source batch
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  generate:
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AURORA_APPROVAL: one-dispatch-batch-attempt
    steps:
    - name: Fetch exact verified helper and generate source batch
      id: generate
      shell: bash
      run: |
        set -euo pipefail
        python3 -I - <<'FETCH_VERIFIED_HELPER'
        import hashlib, os, urllib.request
        from pathlib import Path
        commit = os.environ["GITHUB_SHA"]
        if len(commit) != 40 or any(c not in "0123456789abcdef" for c in commit):
            raise SystemExit("Invalid workflow commit identity")
        url = "https://raw.githubusercontent.com/DjDeveloperr/aurora-darling/" + commit + "/.github/scripts/aurora_iig_dispatch_batch.py"
        with urllib.request.urlopen(url, timeout=20) as response:
            data = response.read(262145)
        expected = "f745355d230b3ad2830bb2b9b6a3987c184944ed07080d3bc51df0eaabeac143"
        if len(data) > 262144 or hashlib.sha256(data).hexdigest() != expected:
            raise SystemExit("Generator helper identity mismatch")
        path = Path(os.environ["RUNNER_TEMP"]) / "aurora-iig-dispatch-batch-helper.py"
        with path.open("xb") as output:
            output.write(data)
        FETCH_VERIFIED_HELPER
        python3 -I "$RUNNER_TEMP/aurora-iig-dispatch-batch-helper.py"
    - name: Upload only new generated source and filtered evidence
      if: ${{ !cancelled() && steps.generate.outputs.bundle_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aurora-iig-dispatch-batch-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOBufferMemoryDescriptor.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOBufferMemoryDescriptor.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOMemoryDescriptor.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOMemoryDescriptor.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOMemoryMap.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOMemoryMap.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOService.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOService.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOUserClient.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOUserClient.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOUserServer.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IOUserServer.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IODataQueueDispatchSource.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IODataQueueDispatchSource.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IODMACommand.h
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/IODMACommand.iig.cpp
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/provenance.json
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/diagnostics.json
          ${{ runner.temp }}/aurora-iig-dispatch-batch/upload/SHA256SUMS
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
        overwrite: false
        include-hidden-files: false
