                      s["records"].append({"category": "public_source_" + location[4].replace(" ", "_"),
                                           "source": public_paths[location[1]],
                                           "line": int(location[2]), "column": int(location[3])})
                      return
                  s["unknown"].update(raw)
                  s["unknown_bytes"] += len(raw)
                  s["unknown_lines"] += 1
          
              try:
                  while selector.get_map():
                      guard_space(cwd)
                      bound_tree(cwd)
                      if time.monotonic() - started > timeout and limit_reason is None:
                          limit_reason = "timeout"
                          kill_group()
                      for key, _ in selector.select(0.1):
                          name = key.data
                          block = os.read(key.fileobj.fileno(), 65536)
                          if not block:
                              selector.unregister(key.fileobj)
                              continue
                          s = states[name]
                          s["hash"].update(block)
                          s["bytes"] += len(block)
                          if len(captures[name]) < 65536:
                              captures[name].extend(block[:65536-len(captures[name])])
                          s["buffer"].extend(block)
                          while b"\n" in s["buffer"]:
                              raw, _, rest = s["buffer"].partition(b"\n")
                              s["buffer"] = bytearray(rest)
                              line(name, bytes(raw) + b"\n")
                          if len(s["buffer"]) > 65536:
                              line(name, bytes(s["buffer"]))
                              s["buffer"].clear()
                          if sum(v["bytes"] for v in states.values()) > 8*1024**2 and limit_reason is None:
                              limit_reason = "diagnostic_size_limit"
                              kill_group()
                  summary["status"] = process.wait(timeout=5)
              finally:
                  kill_group()
                  process.wait(timeout=5)
                  summary["status"] = process.returncode
                  summary["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  for pipe in (process.stdout, process.stderr):
                      pipe.close()
                  selector.close()
                  for name, s in states.items():
                      if s["buffer"]:
                          line(name, bytes(s["buffer"]))
                      streams[name] = {"bytes": s["bytes"], "sha256": s["hash"].hexdigest(),
                                       "unknown_bytes": s["unknown_bytes"],
                                       "unknown_lines": s["unknown_lines"],
                                       "unknown_sha256": s["unknown"].hexdigest(),
                                       "records": s["records"]}
                  summary["limit_reason"] = limit_reason
              if limit_reason:
                  raise Stop(label + "_" + limit_reason)
              return summary["status"], bytes(captures["stdout"]), bytes(captures["stderr"])
          
          
          def extract_sources(archive, src):
              inputs = {}
              total = 0
              prefix = "xnu-" + XNU
              seen = set()
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
                  for index, member in enumerate(tar):
                      if index >= 10000:
                          raise Stop("archive_member_limit")
                      parts = PurePosixPath(member.name).parts
                      if not parts or parts[0] != prefix or ".." in parts or member.name.startswith("/"):
                          raise Stop("archive_path_invalid")
                      rel = "/".join(parts[1:])
                      # Only public headers, IIG inputs, and the specifically reviewed recipes/scripts.
                      wanted = rel in SOURCE_NAMES or (
                          len(parts) > 2 and parts[1] in ("iokit", "osfmk", "bsd", "EXTERNAL_HEADERS")
                          and rel.endswith((".h", ".hpp", ".iig")))
                      if not wanted or member.isdir():
                          continue
                      if not member.isfile() or rel in seen or not 0 <= member.size <= 8*1024**2:
                          raise Stop("archive_member_invalid")
                      total += member.size
                      if total > 128*1024**2:
                          raise Stop("source_size_limit")
                      guard_space(src.parent)
                      data = tar.extractfile(member).read()
                      path = src / rel
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(data)
                      inputs[rel] = record(data)
                      seen.add(rel)
              if not SOURCE_NAMES.issubset(seen) or "iokit/DriverKit/OSObject.iig" not in seen:
                  raise Stop("required_public_inputs_absent")
              return inputs
          
          
          def source_bytes(path):
              if not path.exists():
                  return None, {"present": False}
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode):
                  return None, {"present": True, "bytes": info.st_size, "accepted_source": False,
                                "hash_withheld": "not_regular_file"}
              if not 0 < info.st_size <= 4*1024**2:
                  return None, {"present": True, "bytes": info.st_size, "accepted_source": False,
                                "hash_withheld": "output_size_limit"}
              data = path.read_bytes()
              meta = {"present": True, **record(data), "accepted_source": False}
              try:
                  text = data.decode("utf-8")
              except UnicodeError:
                  return None, meta
              if any(ord(c) < 32 and c not in "\t\r\n" for c in text):
                  return None, meta
              meta["accepted_source"] = True
              return data, meta
          
          
          
          def bound_tree(root):
              """Bound all child-created outputs, including unexpected names, without reading them."""
              total = 0
              count = 0
              for parent, dirs, files in os.walk(root, followlinks=False):
                  for name in dirs + files:
                      p = Path(parent) / name
                      s = p.lstat()
                      count += 1
                      if stat.S_ISLNK(s.st_mode) or not (stat.S_ISDIR(s.st_mode) or stat.S_ISREG(s.st_mode)):
                          raise Stop('unexpected_output_type')
                      total += s.st_size if stat.S_ISREG(s.st_mode) else 0
                      if count > 2048 or total > 160 * 1024**2:
                          raise Stop('scratch_output_limit')
          
          
          def lexical_mask(code):
              # Preserve offsets/lines while excluding comments, quoted text, and raw strings.
              pattern = r'R"([^\s()\\]{0,16})\(.*?\)\1"|/\*.*?\*/|//[^\n]*|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\''
              return re.sub(pattern, lambda m: re.sub(r'[^\n]', ' ', m[0]), code, flags=re.S)
          
          
          def condition(expr, macros):
              """Tiny three-valued grammar. Unsupported syntax/macros stay UNKNOWN, never false."""
              expr = re.sub(r'defined\s*(?:\(\s*([A-Za-z_]\w*)\s*\)|([A-Za-z_]\w*))',
                            lambda m: str(int(macros[m[1] or m[2]] is not None))
                            if (m[1] or m[2]) in macros else 'UNKNOWN', expr)
              tokens = re.findall(r'&&|\|\||!|\(|\)|[A-Za-z_]\w*|[0-9]+|\S', expr)
              index = 0
              def atom():
                  nonlocal index
                  if index >= len(tokens):
                      raise ValueError()
                  token = tokens[index]; index += 1
                  if token == '!':
                      v = atom(); return None if v is None else not v
                  if token == '(':
                      v = disjunction()
                      if index >= len(tokens) or tokens[index] != ')':
                          raise ValueError()
                      index += 1
                      return v
                  if token.isdigit():
                      return bool(int(token))
                  return bool(macros[token]) if token in macros and macros[token] is not None else None
              def conjunction():
                  nonlocal index
                  v = atom()
                  while index < len(tokens) and tokens[index] == '&&':
                      index += 1; v = tri_and(v, atom())
                  return v
              def disjunction():
                  nonlocal index
                  v = conjunction()
                  while index < len(tokens) and tokens[index] == '||':
                      index += 1; v = tri_or(v, conjunction())
                  return v
              try:
                  result = disjunction()
                  return result if index == len(tokens) else None
              except (ValueError, RecursionError):
                  return None
          
          
          def tri_and(a, b):
              return False if a is False or b is False else (True if a is True and b is True else None)
          
          
          def tri_or(a, b):
              return True if a is True or b is True else (False if a is False and b is False else None)
          
          
          def tri_not(a):
              return None if a is None else not a
          
          
          def selected_code(data):
              code = lexical_mask(data.decode('utf-8'))
              selected = []
              unknown_lines = set()
              unknown_conditions = []
              stack = []
              active = True
              macros = {'KERNEL': 1}  # Hypothetical review context, NOT a compiler invocation.
              malformed = False
              continued = False
              for number, line in enumerate(code.splitlines(keepends=True), 1):
                  directive = re.match(r'^\s*#\s*(\w+)\b(.*)', line)
                  if continued:
                      # Unsupported continued directives invalidate definitive recognition.
                      malformed = True
                  continued = bool(directive and line.rstrip().endswith('\\')) or (continued and line.rstrip().endswith('\\'))
                  if directive:
                      op, expr = directive[1], directive[2].strip()
                      if op in ('if', 'ifdef', 'ifndef'):
                          if op in ('ifdef', 'ifndef'):
                              value = (macros[expr] is not None) if expr in macros else None
                              if op == 'ifndef': value = tri_not(value)
                          else:
                              value = condition(expr, macros)
                          if value is None and active is not False:
                              unknown_conditions.append({'line': number, 'expression_sha256': sha(expr.encode()), 'condition': 'unknown'})
                          stack.append([active, value, False])
                          active = tri_and(active, value)
                      elif op in ('elif', 'else'):
                          if not stack or stack[-1][2]:
                              malformed = True
                          else:
                              parent, seen, _ = stack[-1]
                              value = condition(expr, macros) if op == 'elif' else True
                              if value is None and parent is not False:
                                  unknown_conditions.append({'line': number, 'expression_sha256': sha(expr.encode()), 'condition': 'unknown'})
                              active = tri_and(parent, tri_and(tri_not(seen), value))
                              stack[-1][1] = tri_or(seen, value)
                              stack[-1][2] = op == 'else'
                      elif op == 'endif':
                          if not stack: malformed = True
                          else: active = stack.pop()[0]
                      elif op in ('define', 'undef') and active is not False:
                          # Do not guess expansion semantics for source-local macro changes.
                          macro = re.match(r'[A-Za-z_]\w*', expr)
                          if macro: macros.pop(macro[0], None)
                      selected.append(re.sub(r'[^\n]', ' ', line))
                  else:
                      if active is None: unknown_lines.add(number)
                      selected.append(line if active is True else re.sub(r'[^\n]', ' ', line))
              return ''.join(selected), unknown_lines, unknown_conditions, malformed or bool(stack) or continued
          
          
          def definitions(data, target):
              """Conservative text evidence only. No SDK input, macro expansion or compiler."""
              code, unknown, conditions, malformed = selected_code(data)
              result = {'profile': {'KERNEL': 1}, 'unlisted_macros': 'unknown',
                        'unknown_conditions': conditions, 'unknown_line_count': len(unknown),
                        'malformed_or_unsupported_directives': malformed, 'methods': []}
              for method in target['required_methods']:
                  name = target['class_name'] + ('::MetaClass' if method['role'] == 'metaclass' else '') + '::Dispatch'
                  qualified = r'\s*::\s*'.join(name.split('::'))
                  pattern = re.compile(r'(?<![\w:])' + qualified + r'\s*\(\s*(?:const\s+)?IORPC\s+[A-Za-z_]\w*\s*\)\s*\{')
                  matches = []
                  unresolved = 0
                  for match in pattern.finditer(code):
                      if not re.search(r'(?:kern_return_t|IOReturn)\s*$', code[max(0,match.start()-200):match.start()]):
                          continue
                      depth, end = 1, match.end()
                      while end < len(code) and depth:
                          depth += (code[end] == '{') - (code[end] == '}'); end += 1
                      first = code.count('\n', 0, match.start()) + 1
                      last = code.count('\n', 0, end) + 1
                      uncertain = malformed or any(first <= n <= last for n in unknown)
                      if depth or uncertain:
                          unresolved += 1
                      else:
                          matches.append({'line': first, 'end_line': last,
                                          'selected_body_sha256': sha(code[match.end()-1:end].encode()),
                                          'selection': 'known_under_Kernel_1_text_profile'})
                  state = 'one_selected_body_observed' if len(matches) == 1 and not unresolved else 'review_required'
                  # Unknown regions could hide other definitions; never infer uniqueness from their absence.
                  if unknown or conditions or malformed: state = 'review_required_unknown_condition'
                  result['methods'].append({'symbol_from_manifest': method['symbol'], 'qualified_name': name,
                                            'state': state, 'observed_bodies': matches,
                                            'unresolved_recognized_signatures': unresolved})
              result['state'] = ('not_applicable' if not result['methods'] else
                                 'selected_bodies_observed_not_compiled' if all(x['state'] == 'one_selected_body_observed' for x in result['methods']) else 'review_required')
              return result
          
          
          def additional_evidence(data, target):
              code, unknown, conditions, malformed = selected_code(data)
              rows = []
              for req in target.get('additional_requirements', []):
                  name = target['class_name'] + '::' + req['member']
                  q = r'\s*::\s*'.join(name.split('::'))
                  observed = []
                  if req['kind'] == 'static_data_generation_check':
                      pattern = re.compile(r'(?:const\s+)?OSMetaClass\s*\*\s*' + q + r'\s*(?:=|;)')
                      for match in pattern.finditer(code):
                          observed.append({'line': code.count('\n', 0, match.start())+1,
                                           'evidence': 'qualified_storage_candidate_signature_review_required'})
                  else:
                      # Balanced parens include function-pointer parameters. Calls lack a return type.
                      for match in re.finditer(r'(?<![\w:])' + q + r'\s*\(', code):
                          before = code[max(0, match.start()-200):match.start()]
                          if not re.search(r'(?:kern_return_t|IOReturn|void|bool|size_t)\s*$', before): continue
                          depth=1; end=match.end()
                          while end < len(code) and depth:
                              depth += (code[end]=='(') - (code[end]==')'); end+=1
                          pos=end
                          while pos < len(code) and code[pos].isspace(): pos+=1
                          if depth or pos >= len(code) or code[pos]!='{': continue
                          depth=1; bodyend=pos+1
                          while bodyend < len(code) and depth:
                              depth += (code[bodyend]=='{') - (code[bodyend]=='}'); bodyend+=1
                          first=code.count('\n',0,match.start())+1; last=code.count('\n',0,bodyend)+1
                          if not depth and not malformed and not any(first <= n <= last for n in unknown):
                              observed.append({'line':first,'end_line':last,
                                               'selected_signature_sha256':sha(code[match.start():pos].encode()),
                                               'selected_body_sha256':sha(code[pos:bodyend].encode()),
                                               'evidence':'name_and_body_candidate_overload_signature_review_required'})
                  rows.append({'symbol_from_current_undefined':req['symbol'],'qualified_name':name,
                               'state':'review_required_unknown_condition' if unknown or conditions or malformed else 'signature_and_semantics_review_required',
                               'observed_candidates':observed})
              return rows
          
          
          def resolved_argv(target, src, obj, generated, sdk):
              replacements = {'$IIG': str(IIG), '$SRC': str(src), '$OBJ': str(obj), '$GEN': str(generated), '$SDK': str(sdk)}
              result = []
              for arg in target['argv']:
                  for key, value in replacements.items(): arg = arg.replace(key, value)
                  result.append(arg)
              return result
          
          
