                      td['nonempty_source_pair'] = all(x.get('accepted_source',False) for x in td['outputs'].values())
                      td['candidate_status'] = ('generated_source_requires_review' if td['generation_status']=='exited_zero' and td['nonempty_source_pair'] else 'incomplete_or_failed_generation')
                  success = all(x['candidate_status']=='generated_source_requires_review' for x in report['targets'].values())
                  if success: report['status'] = 'generated_sources_require_review'
                  report['generation_success'] = success
                  # Ambiguous text evidence is not misreported as IIG/tool failure.
                  report['all_selected_bodies_observed'] = all(x['evidence_status'] in ('selected_bodies_observed_not_compiled','not_applicable') for x in report['targets'].values())
                  try: report['free_final_bytes'] = guard_space(root)
                  except Stop: report['free_space_floor_breached'] = True; success = False
                  dump(out/'provenance.json',report); dump(out/'diagnostics.json',diagnostics)
                  paths = sorted(out.iterdir())
                  (out/'SHA256SUMS').write_text(''.join(sha(p.read_bytes())+'  '+p.name+'\n' for p in paths))
                  with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write('bundle_ready=true\n')
                  signal.alarm(0)
                  print('IIG batch attempt finished; inspect filtered provenance and generated source.')
              return 0 if success else 1
          
          
          if __name__ == '__main__':
              try:
                  raise SystemExit(main())
              except Exception:
                  print('IIG batch preflight or collection failed; no raw diagnostic output retained.')
                  raise SystemExit(1)
          AURORA_PY
          python3 -I "$RUNNER_TEMP/aurora-iig-dispatch-batch-helper.py"
      - name: Upload only new generated source and filtered evidence
        if: ${{ !cancelled() && steps.generate.outputs.bundle_ready == 'true' }}
